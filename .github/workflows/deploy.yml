# Publica la web en GitHub Pages solo cuando los controles de ci.yml pasaron en main.
name: Publicar

on:
  workflow_run:
    workflows: [Controles]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: Empaquetar solo lo que se sirve
        run: |
          mkdir -p _sitio
          cp -R index.html visor.js gracias reproductor styles.css fonts img muestra redes audio .nojekyll _sitio/
          [ -f CNAME ] && cp CNAME _sitio/ || true
          # Cloudflare guarda styles.css 4 horas en el navegador: la URL cambia en cada publicación (cache-busting)
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${GITHUB_SHA::7}\"|; s|src=\"visor.js\"|src=\"visor.js?v=${GITHUB_SHA::7}\"|" _sitio/index.html
          sed -i "s|href=\"../styles.css\"|href=\"../styles.css?v=${GITHUB_SHA::7}\"|" _sitio/gracias/index.html _sitio/reproductor/index.html
          sed -i "s|href=\"reproductor.css\"|href=\"reproductor.css?v=${GITHUB_SHA::7}\"|; s|src=\"reproductor.js\"|src=\"reproductor.js?v=${GITHUB_SHA::7}\"|" _sitio/reproductor/index.html
          grep -q "styles.css?v=${GITHUB_SHA::7}" _sitio/index.html _sitio/gracias/index.html _sitio/reproductor/index.html
          grep -q "reproductor.js?v=${GITHUB_SHA::7}" _sitio/reproductor/index.html
          grep -q "visor.js?v=${GITHUB_SHA::7}" _sitio/index.html
          du -sh _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
