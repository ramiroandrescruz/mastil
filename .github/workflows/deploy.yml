# Publica la web en GitHub Pages solo cuando los controles de ci.yml pasaron en main.
name: Publicar

on:
  workflow_run:
    workflows: [Controles]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empaquetar solo lo que se sirve
        run: |
          mkdir -p _sitio
          cp -R index.html styles.css fonts img muestra redes .nojekyll _sitio/
          [ -f CNAME ] && cp CNAME _sitio/ || true
          du -sh _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
